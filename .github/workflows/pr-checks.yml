name: CI - PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'

jobs:
  lint:
    name: PR Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Server dependencies
        run: npm ci
        working-directory: Server

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Install Admin dependencies
        run: npm ci
        working-directory: Admin

      - name: Lint Frontend
        run: npm run lint
        working-directory: Frontend

      - name: Lint Admin
        run: npm run lint
        working-directory: Admin

  build:
    name: PR Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Server dependencies
        run: npm ci
        working-directory: Server

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Install Admin dependencies
        run: npm ci
        working-directory: Admin

      - name: Build Frontend
        run: npm run build
        working-directory: Frontend

      - name: Build Admin
        run: npm run build
        working-directory: Admin

  test:
    name: PR Test
    runs-on: ubuntu-latest
    needs: build
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Server dependencies
        run: npm ci
        working-directory: Server

      - name: Run Server tests
        run: npm test
        working-directory: Server
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/dharma-mart-test
          JWT_SECRET: test-secret-key

  coverage:
    name: PR Coverage
    runs-on: ubuntu-latest
    needs: test
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Server dependencies
        run: npm ci
        working-directory: Server

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: Server
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/dharma-mart-test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: Server/coverage/lcov.info
          flags: server
          fail_ci_if_error: false
        continue-on-error: true

  pr-summary:
    name: PR Status Summary
    runs-on: ubuntu-latest
    needs: [lint, build, test, coverage]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
