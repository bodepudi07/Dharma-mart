name: CI - Push Checks

on:
  push:
    branches: ['**']

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'

jobs:
  lint:
    name: CI Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Server dependencies
        run: npm ci
        working-directory: Server

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Install Admin dependencies
        run: npm ci
        working-directory: Admin

      - name: Lint Frontend
        run: npm run lint
        working-directory: Frontend

      - name: Lint Admin
        run: npm run lint
        working-directory: Admin

  build:
    name: CI Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Server dependencies
        run: npm ci
        working-directory: Server

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Install Admin dependencies
        run: npm ci
        working-directory: Admin

      - name: Build Frontend
        run: npm run build
        working-directory: Frontend

      - name: Build Admin
        run: npm run build
        working-directory: Admin

      - name: Upload Frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/dist
          retention-days: 7

      - name: Upload Admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: Admin/dist
          retention-days: 7

  test:
    name: CI Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Server dependencies
        run: npm ci
        working-directory: Server

      - name: Run Server tests
        run: npm test
        working-directory: Server
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key
