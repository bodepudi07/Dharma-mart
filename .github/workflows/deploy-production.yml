name: Deploy - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Install Admin dependencies
        run: npm ci
        working-directory: Admin

      - name: Build Frontend
        run: npm run build
        working-directory: Frontend

      - name: Build Admin
        run: npm run build
        working-directory: Admin

      - name: Upload Frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/dist
          retention-days: 7

      - name: Upload Admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: Admin/dist
          retention-days: 7

  deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://dharma-mart.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: Frontend/dist

      - name: Download Admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-build
          path: Admin/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install production dependencies
        run: npm ci --production
        working-directory: Server

      # Option 1: Deploy to Railway
      # - name: Deploy to Railway
      #   uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: ${{ secrets.RAILWAY_SERVICE }}

      # Option 2: Deploy to Render
      # - name: Deploy to Render
      #   uses: johnbeynon/render-deploy-action@v1.0.0
      #   with:
      #     service-id: ${{ secrets.RENDER_SERVICE_ID }}
      #     api-key: ${{ secrets.RENDER_API_KEY }}

      # Option 3: Deploy via SSH
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /var/www/dharma-mart
      #       git pull origin main
      #       cd Server && npm ci --production
      #       cd ../Frontend && npm ci && npm run build
      #       cd ../Admin && npm ci && npm run build
      #       pm2 restart dharma-mart-api

      # Option 4: Deploy to Vercel (Frontend/Admin only)
      # - name: Deploy Frontend to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
      #     working-directory: ./Frontend

      - name: Deployment notification
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "Frontend: https://dharma-mart.com"
          echo "Admin: https://admin.dharma-mart.com"
          echo "API: https://api.dharma-mart.com"

  notify:
    name: Production Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Notify on success
        if: ${{ needs.deploy.result == 'success' }}
        run: |
          echo "✅ Production deployment successful!"
          # Add Slack/Discord/Email notification here

      - name: Notify on failure
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "❌ Production deployment failed!"
          # Add failure notification here
