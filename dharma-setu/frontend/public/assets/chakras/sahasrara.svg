<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Multi-Petal Lotus (1000 petals simplified as concentric rings) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1">
    <!-- Outer ring of petals -->
    <ellipse cx="100" cy="52" rx="10" ry="30" />
    <ellipse cx="100" cy="52" rx="10" ry="30" transform="rotate(20,100,100)"/>
    <ellipse cx="100" cy="52" rx="10" ry="30" transform="rotate(40,100,100)"/>
    <ellipse cx="100" cy="52" rx="10" ry="30" transform="rotate(60,100,100)"/>
    <ellipse cx="100" cy="52" rx="10" ry="30" transform="rotate(80,100,100)"/>
    <ellipse cx="100" cy="52" rx="10" ry="30" transform="rotate(100,100,100)"/>
    <ellipse cx="100" cy="52" rx="10" ry="30" transform="rotate(120,100,100)"/>
    <ellipse cx="100" cy="52" rx="10" ry="30" transform="rotate(140,100,100)"/>
    <ellipse cx="100" cy="52" rx="10" ry="30" transform="rotate(160,100,100)"/>
    <!-- Inner ring of petals -->
    <ellipse cx="100" cy="62" rx="8" ry="24" />
    <ellipse cx="100" cy="62" rx="8" ry="24" transform="rotate(30,100,100)"/>
    <ellipse cx="100" cy="62" rx="8" ry="24" transform="rotate(60,100,100)"/>
    <ellipse cx="100" cy="62" rx="8" ry="24" transform="rotate(90,100,100)"/>
    <ellipse cx="100" cy="62" rx="8" ry="24" transform="rotate(120,100,100)"/>
    <ellipse cx="100" cy="62" rx="8" ry="24" transform="rotate(150,100,100)"/>
  </g>
  <!-- Central Bindu (Point of Supreme Consciousness) -->
  <circle cx="100" cy="100" r="22" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="100" cy="100" r="4" fill="#1a1a1a"/>
  <!-- Radiating light lines -->
  <g stroke="#1a1a1a" stroke-width="0.8" opacity="0.6">
    <line x1="100" y1="78" x2="100" y2="68"/>
    <line x1="116" y1="84" x2="122" y2="78"/>
    <line x1="122" y1="100" x2="132" y2="100"/>
    <line x1="116" y1="116" x2="122" y2="122"/>
    <line x1="100" y1="122" x2="100" y2="132"/>
    <line x1="84" y1="116" x2="78" y2="122"/>
    <line x1="78" y1="100" x2="68" y2="100"/>
    <line x1="84" y1="84" x2="78" y2="78"/>
  </g>
</svg>