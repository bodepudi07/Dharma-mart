<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 6-Petal Lotus -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <ellipse cx="100" cy="58" rx="18" ry="36" />
    <ellipse cx="100" cy="58" rx="18" ry="36" transform="rotate(60,100,100)"/>
    <ellipse cx="100" cy="58" rx="18" ry="36" transform="rotate(120,100,100)"/>
    <ellipse cx="100" cy="58" rx="18" ry="36" transform="rotate(180,100,100)"/>
    <ellipse cx="100" cy="58" rx="18" ry="36" transform="rotate(240,100,100)"/>
    <ellipse cx="100" cy="58" rx="18" ry="36" transform="rotate(300,100,100)"/>
  </g>
  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Crescent Moon (Water Element) -->
  <path d="M 78,105 A 22,22 0 0,1 122,105 A 18,14 0 0,0 78,105" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Bija Mantra VAM -->
  <text x="100" y="105" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#1a1a1a">वं</text>
</svg>