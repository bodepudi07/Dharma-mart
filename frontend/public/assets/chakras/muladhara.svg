<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 4-Petal Lotus -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <ellipse cx="100" cy="60" rx="22" ry="38" transform="rotate(0,100,100)"/>
    <ellipse cx="140" cy="100" rx="22" ry="38" transform="rotate(90,100,100)"/>
    <ellipse cx="100" cy="140" rx="22" ry="38" transform="rotate(0,100,100)"/>
    <ellipse cx="60" cy="100" rx="22" ry="38" transform="rotate(90,100,100)"/>
  </g>
  <!-- Square (Earth Element) -->
  <rect x="72" y="72" width="56" height="56" fill="none" stroke="#1a1a1a" stroke-width="2.5" transform="rotate(0,100,100)"/>
  <!-- Downward Triangle -->
  <polygon points="100,118 82,85 118,85" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Bija Mantra LAM -->
  <text x="100" y="108" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#1a1a1a">लं</text>
</svg>